[package]
name = "argus"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dotenvy = "0.15"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.36", features = ["bundled"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "net", "io-util", "io-std", "fs"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
sha2 = "0.10"
regex = "1"
petgraph = "0.8"
libc = "0.2"
chromiumoxide = "0.9"
tauri-plugin-notification = "2"
zip = "8.6.0"
pdf-extract = "0.12.1"
tauri-plugin-dialog = "2.8.0"
whisper-rs = "0.16"

# whisper-rs declares default = [], so a bare dependency is plain CPU with no
# BLAS at all — the single biggest lever on decode time, and larger than the
# model choice. Features are additive, so each platform asks for its own.
#
#   macOS   Metal ships with the OS. Nothing to install, and it is the whole
#           reason a 60s clip is seconds rather than a coffee break.
#   Linux   OpenMP links libgomp, which gcc already provides. OpenBLAS would be
#           faster still but it is a system package nobody has by default, and
#           a build that needs `apt install` is not a build that ships.
#   Windows left plain for now: the acceleration features there need a Visual
#           Studio or vcpkg toolchain this repo does not set up, and shipping a
#           flag that has never been compiled is worse than shipping none.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16", features = ["openmp"] }
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
zip = "8.6.0"

[lints.clippy]
# Cherry-picked, not pedantic: these groups catch real defects without
# fighting deliberate patterns (static-regex expect, IPC-shaped commands,
# test-harness serial guards). Zero warnings is the invariant — fix the code,
# never sprinkle allows, except where a comment names the reason.
perf = "warn"
complexity = "warn"
suspicious = "warn"

# Not a style group. The gateway hands out `Mutex<Connection>` as the
# single-writer handle, and a guard held across an `.await` parks the lock
# for the whole suspension — every other task that wants the database waits
# on a thread that is itself waiting. The compiler cannot see it, so it is
# worth naming here.
await_holding_lock = "warn"

# Release tuning. The defaults are opt-level 3 with no LTO and 16 codegen
# units, which leaves most of the cross-crate calls in the parser, the
# gateway and the turn loop as out-of-line calls. Fat LTO and a single codegen
# unit is the usual recommendation for a Tauri app whose hot path is a Rust
# core rather than a webview, and it is what makes `cargo run --release` a
# fair number to measure against.
#
# `panic = "abort"` is deliberately NOT set. It would be a little faster and a
# little smaller, and it changes behaviour on a bug that should be impossible
# anyway — an unwind through Tauri means a panic the user can see and the app
# can report, which is worth more than the frames.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
